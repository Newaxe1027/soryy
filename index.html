<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ለኔ ልዩ ፍቅር... ይቅርታ ❤️</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        /* ሮማንቲክ እና ሞቅ ያለ የፍቅር ባክግራውንድ */
        background: linear-gradient(135deg, #2b0918, #590d22, #800f2f, #a71e34);
        background-size: 400% 400%;
        animation: romanticGradient 12s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        position: relative;
      }

      @keyframes romanticGradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* የሚንቀሳቀሱ እና የሚያበሩ የልብ ቅርጾች */
      .bg-heart {
        position: absolute;
        color: rgba(255, 182, 193, 0.4);
        font-size: 26px;
        animation: floatUp 6s linear infinite;
        z-index: 0;
        text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
      }

      @keyframes floatUp {
        0% {
          transform: translateY(100vh) scale(0.5) rotate(0deg);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(-10vh) scale(1.3) rotate(360deg);
          opacity: 0;
        }
      }

      /* Glassmorphism Romantic Card Container */
      .container {
        position: relative;
        z-index: 10;
        background: rgba(255, 204, 213, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 182, 193, 0.35);
        padding: 40px 25px;
        border-radius: 28px;
        text-align: center;
        width: 90%;
        max-width: 420px;
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.5),
          0 0 30px rgba(255, 75, 110, 0.2);
      }

      .icon-box {
        font-size: 55px;
        margin-bottom: 15px;
        animation: pulse 1.5s infinite;
        filter: drop-shadow(0 0 10px rgba(255, 107, 129, 0.8));
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.18);
        }
      }

      h1 {
        color: #ffb3c1;
        font-size: 25px;
        margin-bottom: 18px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .message-card {
        background: rgba(255, 240, 245, 0.95);
        padding: 22px;
        border-radius: 18px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 25px;
        box-shadow: 0 8px 25px rgba(89, 13, 34, 0.25);
        border: 1px solid #ffccd5;
        transition: all 0.3s ease;
      }

      p {
        color: #590d22;
        font-size: 16px;
        line-height: 1.6;
        font-weight: 500;
      }

      .btn-group {
        display: flex;
        gap: 15px;
        justify-content: center;
      }

      button {
        background: linear-gradient(135deg, #ff4d6d, #c9184a);
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(201, 24, 74, 0.5);
      }

      button:hover {
        background: linear-gradient(135deg, #ff758f, #ff4d6d);
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(255, 77, 109, 0.7);
      }

      #next-btn {
        background: linear-gradient(135deg, #ff758f, #ff4d6d);
        box-shadow: 0 6px 20px rgba(255, 117, 143, 0.5);
      }

      #next-btn:hover {
        background: linear-gradient(135deg, #ff8fa3, #ff758f);
      }

      .telegram-btn {
        background: linear-gradient(135deg, #ff0054, #9e0059) !important;
        box-shadow: 0 6px 22px rgba(255, 0, 84, 0.6) !important;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }

      .telegram-btn:hover {
        background: linear-gradient(135deg, #ff5400, #ff0054) !important;
      }
    </style>
  </head>
  <body>
    <!-- Background Floating Hearts -->
    <div class="bg-heart" style="left: 10%; animation-delay: 0s">❤️</div>
    <div class="bg-heart" style="left: 30%; animation-delay: 2s">💖</div>
    <div class="bg-heart" style="left: 55%; animation-delay: 1s">✨</div>
    <div class="bg-heart" style="left: 75%; animation-delay: 3s">💕</div>
    <div class="bg-heart" style="left: 90%; animation-delay: 1.5s">❤️</div>

    <div class="container" id="main-container">
      <div class="icon-box" id="emoji">💌</div>
      <h1 id="title">ለኔ ልዩ ሚስት...</h1>

      <div class="message-card">
        <p id="message-text">
          ሳልደውልልሽ በመቅረቴ እና አንቺን በማስከፋቴ ማርያምን ክልቤ በጣም ይቅርታ ይህንን መካስ እፈልጋለሁ...
        </p>
      </div>

      <div class="btn-group" id="actions">
        <button id="next-btn" onclick="nextMessage()">ቀጥል ➔</button>
      </div>
    </div>

    <script>
      // ⚠️ እዚህ ጋር የአንተን Telegram Username ብቻ ቀይር (ያለ @ ምልክት)
      const myTelegramUsername = "ERma32227";

      const messages = [
        "ሳልደውልልሽ በመቅረቴ እና አንቺን በማስከፋቴ ማርያምን ክልቤ በጣም ይቅርታ ይህንን መካስ እፈልጋለሁ...",
        "አንቺ በእኔ ሕይወት ውስጥ ትልቅ ቦታ አለሽ ለዛም ነው አንቺ በእኔ ምክንያት በፍፁም እንድታዝኚ አልፈልግም ክህነቴ🥺",
        "የኔ፣የኔ አበባ፣የኔ ዘውድ፣የኔ ሁል ነገር፣የኔ ሁልነገር፣የአጥንቴ ፍላጨ፣የሕይወቴ ኮከብ፣ቤተክርስቲያኔ፣ክህነቴ ቅዱስ ገብርኤልን እጀግ በጣም ነው የማፈቅርሽ🌹🌹🌹",
        "መባዬ እንደዚህ ሆኜ እንደዛ ተፈጥሮ እያልኩ አላወራም አጥፍቻለሁ አምናለሁ የኔ ልዕልት በጣም ይቅርታ ",
      ];

      let currentIndex = 0;
      const messageText = document.getElementById("message-text");
      const title = document.getElementById("title");
      const emoji = document.getElementById("emoji");
      const actions = document.getElementById("actions");

      function nextMessage() {
        currentIndex++;

        // የጽሁፎቹ ቁጥር ሲያልቅ (የመጨረሻው ጥያቄ ገጽ ላይ ሲደርስ)
        if (currentIndex >= messages.length) {
          title.innerText = "የእውነት ይቅር ትይኛለሽ?";
          emoji.innerText = "🥺❤️";
          messageText.innerHTML =
            "<b>እባክሽን ይቅርታዬን ተቀብለሽ እንታረቅ?</b><br>ሁሉንም ነገር ወደ ቀድሞው ውብ ጊዜ እንመልሰው!";

          actions.innerHTML = `
                    <button onclick="acceptAndSendTelegram()" class="telegram-btn">
                        አዎ፣ እንታረቅ! 🥰
                    </button>
                `;
        } else {
          // ገና መልዕክቶች ካልተጠናቀቁ
          messageText.style.opacity = 0;
          setTimeout(() => {
            messageText.innerText = messages[currentIndex];
            messageText.style.opacity = 1;
          }, 200);

          // የመጨረሻው መልዕክት ላይ ሲደርስ የቁልፉን ጽሁፍ ይቀይራል
          if (currentIndex === messages.length - 1) {
            document.getElementById("next-btn").innerText = "ፍጻሜውን ለማየት ➔";
          }
        }
      }

      function acceptAndSendTelegram() {
        const textToSend = encodeURIComponent(
          "ይቅርታህን ተቀብያለሁ! እኔም በጣም እወድሃለሁ ❤️🥰",
        );
        const telegramUrl = `https://t.me/${myTelegramUsername}?text=${textToSend}`;
        window.open(telegramUrl, "_blank");
      }
    </script>
  </body>
</html>
